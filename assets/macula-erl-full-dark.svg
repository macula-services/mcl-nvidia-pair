<?xml version="1.0" encoding="UTF-8"?>
<!-- Macula full logo, ERL badge (dark theme). Speculative: for a possible
     macula → macula-erl rename that would mark the Erlang/OTP reference
     implementation now that Go/Rust/PHP/.NET ports exist under their own
     macula-{lang} names — not an executed rename, see the artwork README.
     Badge glyph is Macrel, a small mascot in the filled-illustration style
     of the Go/Rust/PHP badges (not macula's own CLI/MCP/Station line-icon
     convention). See macula-erl-full-light.svg for the light variant. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 88" width="240" height="88">
  <!-- Icon -->
  <g transform="translate(4, 12) scale(0.64)">
    <!-- Subtle grid -->
    <g stroke="#38BDF8" stroke-width="0.5" opacity="0.08">
      <line x1="0" y1="25" x2="100" y2="25"/>
      <line x1="0" y1="50" x2="100" y2="50"/>
      <line x1="0" y1="75" x2="100" y2="75"/>
      <line x1="25" y1="0" x2="25" y2="100"/>
      <line x1="50" y1="0" x2="50" y2="100"/>
      <line x1="75" y1="0" x2="75" y2="100"/>
    </g>

    <!-- Irregular mesh connections -->
    <g stroke="#38BDF8" stroke-width="1.5" fill="none">
      <line x1="22" y1="20" x2="50" y2="32"/>
      <line x1="50" y1="32" x2="78" y2="18"/>
      <line x1="22" y1="20" x2="15" y2="52"/>
      <line x1="78" y1="18" x2="85" y2="45"/>
      <line x1="15" y1="52" x2="35" y2="55"/>
      <line x1="35" y1="55" x2="50" y2="50"/>
      <line x1="50" y1="50" x2="68" y2="48"/>
      <line x1="68" y1="48" x2="85" y2="45"/>
      <line x1="15" y1="52" x2="28" y2="80"/>
      <line x1="35" y1="55" x2="50" y2="78"/>
      <line x1="50" y1="50" x2="50" y2="78"/>
      <line x1="68" y1="48" x2="72" y2="75"/>
      <line x1="85" y1="45" x2="72" y2="75"/>
      <line x1="28" y1="80" x2="50" y2="78"/>
      <line x1="50" y1="78" x2="72" y2="75"/>
      <line x1="22" y1="20" x2="35" y2="55" stroke-dasharray="3,2" opacity="0.5"/>
      <line x1="78" y1="18" x2="68" y2="48" stroke-dasharray="3,2" opacity="0.5"/>
      <line x1="50" y1="32" x2="50" y2="50" stroke-dasharray="3,2" opacity="0.5"/>
    </g>

    <!-- Orange accents -->
    <g stroke="#FB923C" stroke-width="2" fill="none">
      <line x1="35" y1="55" x2="68" y2="48"/>
      <line x1="50" y1="32" x2="35" y2="55" stroke-dasharray="4,3"/>
    </g>

    <!-- Primary nodes -->
    <g stroke="#38BDF8" stroke-width="2" fill="#1E293B">
      <circle cx="22" cy="20" r="4"/>
      <circle cx="78" cy="18" r="4"/>
      <circle cx="15" cy="52" r="3"/>
      <circle cx="85" cy="45" r="3"/>
      <circle cx="28" cy="80" r="4"/>
      <circle cx="72" cy="75" r="4"/>
    </g>

    <!-- Hub nodes -->
    <g stroke="#38BDF8" stroke-width="2" fill="#F8FAFC">
      <circle cx="50" cy="32" r="4"/>
      <circle cx="50" cy="78" r="4"/>
    </g>

    <!-- Central hub -->
    <circle cx="50" cy="50" r="7" stroke="#38BDF8" stroke-width="2" fill="#1E293B"/>
    <circle cx="50" cy="50" r="3.5" fill="#38BDF8"/>

    <!-- Secondary nodes -->
    <g stroke="#38BDF8" stroke-width="1.5" fill="#1E293B">
      <circle cx="35" cy="55" r="3"/>
      <circle cx="68" cy="48" r="3"/>
    </g>
    <g fill="#FB923C">
      <circle cx="35" cy="55" r="1.5"/>
      <circle cx="68" cy="48" r="1.5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="76" y="46"
        font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace"
        font-size="30"
        font-weight="600"
        fill="#38BDF8"
        letter-spacing="-0.5px">MACULA</text>
  <text x="77" y="68"
        font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace"
        font-size="15"
        font-weight="500"
        fill="#FB923C"
        letter-spacing="3px">ERL</text>

  <!-- ERL badge: Macrel, a mascot in the same spirit as the Go/Rust/PHP
       badges (filled illustration, not a line icon) rather than macula's
       own CLI/MCP/Station convention. Fixed colors in both theme files,
       like those language logos — only the circle stroke tracks theme. -->
  <circle cx="54" cy="66" r="13" fill="#F8FAFC" stroke="#38BDF8" stroke-width="2"/>
  <g transform="translate(42, 54)">
    <path d="M9,12 L3,5 L6.5,12 L3,19 Z" fill="#0284C7" stroke="#0C1929" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M9,12 C9,6.5 14,4 17,4 C20.5,4 22,8 22,12 C22,16 20.5,20 17,20 C14,20 9,17.5 9,12 Z"
          fill="#0EA5E9" stroke="#0C1929" stroke-width="0.8"/>
    <path d="M10,14 C11,17 14,18.5 17,18 C19,17.5 20,15.5 20,14 C18,16.5 12,16.5 10,14 Z" fill="#F8FAFC"/>
    <path d="M13,5 L15,1.5 L17.5,5 Z" fill="#0284C7" stroke="#0C1929" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M13,18.5 L11.5,22 L16,20 Z" fill="#0284C7" stroke="#0C1929" stroke-width="0.8" stroke-linejoin="round"/>
    <g fill="none" stroke="#0C1929" stroke-width="1" stroke-linecap="round">
      <path d="M11,7 Q12.5,6 14,7"/>
      <path d="M14,6.5 Q15.5,5.5 17,6.5"/>
      <path d="M17,7 Q18.5,6.5 20,7.5"/>
    </g>
    <circle cx="18.5" cy="9" r="2" fill="#F8FAFC" stroke="#0C1929" stroke-width="0.5"/>
    <circle cx="19" cy="9" r="1" fill="#0C1929"/>
    <circle cx="19.3" cy="8.5" r="0.4" fill="#F8FAFC"/>
    <path d="M22,12 Q23.5,12 23.5,13.5" fill="none" stroke="#0C1929" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
