<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="mcl-nvidia-pair components">
<title>mcl-nvidia-pair components</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="620"/>
<rect class="bound" x="16" y="40" width="968" height="520" rx="12"/>
<text class="t-bound" x="32" y="62">mcl-nvidia-pair service [Container]</text>
<rect class="b-cmp" x="32" y="70" width="456" height="120" rx="10"/>
<text class="t-code" x="48" y="98">mcl_nvidia_pair_service</text>
<text class="t-type" x="48" y="116">[mcl_om_service module]</text>
<text class="t-desc" x="48" y="140">One capability, chat, with auth realm_member_required over the realm key's</text>
<text class="t-desc" x="48" y="156">id and required_can (member/email-verified by default). Announces nothing</text>
<text class="t-desc" x="48" y="172">without a realm key: this forwards onto someone's own hardware.</text>
<rect class="b-cmp" x="512" y="70" width="456" height="120" rx="10"/>
<text class="t-code" x="528" y="98">mcl_nvidia_pair_mesh_rpc</text>
<text class="t-type" x="528" y="116">[macula_response handler]</text>
<text class="t-desc" x="528" y="140">Per call: fold the payload to one shape, take the wire-authenticated</text>
<text class="t-desc" x="528" y="156">caller, ask the limiter, forward. Macula verified the UCAN before this</text>
<text class="t-desc" x="528" y="172">ran, so no token is parsed here.</text>
<rect class="b-sys" x="32" y="220" width="456" height="130" rx="10"/>
<text class="t-code" x="48" y="248">throttle_pair_callers</text>
<text class="t-type" x="48" y="266">[gen_server, ets]</text>
<text class="t-desc" x="48" y="290">Fixed window per caller, atomic ets:update_counter: a rejected call still</text>
<text class="t-desc" x="48" y="306">counts. max_per_window and window_seconds come from the environment</text>
<text class="t-desc" x="48" y="322">(PAIR_MAX_PER_WINDOW, PAIR_WINDOW_SECONDS), shipped at 20 per 60 s.</text>
<rect class="b-sys" x="512" y="220" width="456" height="130" rx="10"/>
<text class="t-code" x="528" y="248">chat_to_pair</text>
<text class="t-type" x="528" y="266">[module, httpc]</text>
<text class="t-desc" x="528" y="290">Builds the outbound request itself (POST &lt;facade&gt;/v1/chat/completions)</text>
<text class="t-desc" x="528" y="306">and parses choices[0].message.content. probe/0 is /v1/models, for /health.</text>
<text class="t-desc" x="528" y="322">No caller-supplied path, method or header is ever relayed.</text>
<rect class="b-cmp" x="32" y="390" width="456" height="110" rx="10"/>
<text class="t-code" x="48" y="418">mcl_nvidia_pair_sup</text>
<text class="t-type" x="48" y="436">[supervisor]</text>
<text class="t-desc" x="48" y="460">One permanent child: the limiter. Health is health_of/2 over the</text>
<text class="t-desc" x="48" y="476">capabilities and the PAIR probe, so an unconfigured bridge reads</text>
<text class="t-desc" x="48" y="492">degraded rather than healthy.</text>
<rect class="b-ext" x="512" y="390" width="456" height="110" rx="10"/>
<text class="t-code" x="528" y="418">PAIR proxy</text>
<text class="t-type" x="528" y="436">[External system]</text>
<text class="t-desc" x="528" y="460">127.0.0.1:11435 over plain loopback HTTP:</text>
<text class="t-desc" x="528" y="476">the same interface PAIR gives every consumer</text>
<text class="t-desc" x="528" y="492">on that machine.</text>
<path class="edge" d="M740 190V220" marker-end="url(#a)"/>
<text class="t-rel" x="748" y="210">allow/1</text>
<path class="edge" d="M488 285H512" marker-end="url(#a)"/>
<text class="t-rel" x="500" y="276" text-anchor="middle">chat/3</text>
<path class="edge" d="M740 350V390" marker-end="url(#a)"/>
<text class="t-rel" x="748" y="374">HTTP</text>
<path class="edge" d="M260 500V520" marker-end="url(#a)"/>
<text class="t-rel" x="268" y="512">supervises</text>
<rect class="b-sys" x="24" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="602">In scope</text>
<rect class="b-per" x="110.8" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="602">Person</text>
<rect class="b-mac" x="184.39999999999998" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="602">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="602">External system</text>
<rect class="b-cmp" x="490.0" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="602">Container or component</text>
<rect class="b-later" x="669.2" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="699.2" y="602">Planned, not built</text>
<rect class="bound" x="822.0" y="590" width="22" height="14" rx="3"/>
<text class="t-leg" x="852.0" y="602">Boundary</text>
</svg>
