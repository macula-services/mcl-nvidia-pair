<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" role="img" aria-label="mcl-nvidia-pair components">
<title>mcl-nvidia-pair components</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="960"/>
<rect class="bound" x="16" y="40" width="968" height="660" rx="12"/>
<text class="t-bound" x="32" y="62">mcl-nvidia-pair [Container]</text>
<rect class="b-cmp" x="32" y="70" width="456" height="120" rx="10"/>
<text class="t-code" x="48" y="98">mcl_nvidia_pair_service</text>
<text class="t-type" x="48" y="116">[mcl_om_service behaviour]</text>
<text class="t-desc" x="48" y="140">The six callbacks mcl_om resolves by name at</text>
<text class="t-desc" x="48" y="156">startup. One capability, chat, gated</text>
<text class="t-desc" x="48" y="172">realm_member_required with the realm key id</text>
<rect class="b-cmp" x="512" y="70" width="456" height="104" rx="10"/>
<text class="t-code" x="528" y="98">mcl_nvidia_pair_app</text>
<text class="t-type" x="528" y="116">[OTP application]</text>
<text class="t-desc" x="528" y="140">mcl_om:boot/1 wires the mesh, the realm</text>
<text class="t-desc" x="528" y="156">identity and /health, then starts the service</text>
<rect class="b-sys" x="32" y="214" width="456" height="140" rx="10"/>
<text class="t-code" x="48" y="242">mcl_nvidia_pair_mesh_rpc</text>
<text class="t-type" x="48" y="260">[macula_response handler]</text>
<text class="t-desc" x="48" y="284">handle_request/2 folds the payload to binary keys,</text>
<text class="t-desc" x="48" y="300">reads the wire-authenticated caller, asks the</text>
<text class="t-desc" x="48" y="316">limiter, then forwards one chat to chat_to_pair.</text>
<text class="t-desc" x="48" y="332">Every reply string is tagged text</text>
<rect class="b-cmp" x="512" y="214" width="456" height="140" rx="10"/>
<text class="t-code" x="528" y="242">throttle_pair_callers</text>
<text class="t-type" x="528" y="260">[gen_server, ETS]</text>
<text class="t-desc" x="528" y="284">A fixed window per caller: 20 in 60 s by default.</text>
<text class="t-desc" x="528" y="300">A rejected call still counts (fail-closed).</text>
<text class="t-desc" x="528" y="316">Sweeps closed windows every 60 s. In memory,</text>
<text class="t-desc" x="528" y="332">one node; not a distributed limiter</text>
<rect class="b-cmp" x="32" y="378" width="456" height="140" rx="10"/>
<text class="t-code" x="48" y="406">chat_to_pair</text>
<text class="t-type" x="48" y="424">[HTTP client over loopback; jsx ~&gt; 3.1]</text>
<text class="t-desc" x="48" y="448">POST /v1/chat/completions to 127.0.0.1:11434,</text>
<text class="t-desc" x="48" y="464">timeout 120 s; probe/0 GETs /v1/models for</text>
<text class="t-desc" x="48" y="480">health. Builds the body itself; it never relays</text>
<text class="t-desc" x="48" y="496">a caller's path or method</text>
<rect class="b-cmp" x="512" y="378" width="456" height="140" rx="10"/>
<text class="t-code" x="528" y="406">mcl_nvidia_pair_sup</text>
<text class="t-type" x="528" y="424">[supervisor, one_for_one]</text>
<text class="t-desc" x="528" y="448">No children. chat_to_pair_sup is empty too;</text>
<text class="t-desc" x="528" y="464">throttle_pair_callers_sup owns the limiter</text>
<text class="t-desc" x="528" y="480">gen_server. The three OTP applications start</text>
<text class="t-desc" x="528" y="496">before the service boots</text>
<rect class="b-mac" x="32" y="542" width="456" height="120" rx="10"/>
<text class="t-code" x="48" y="570">mcl_om</text>
<text class="t-type" x="48" y="588">[library, ~&gt; 1.4]</text>
<text class="t-desc" x="48" y="612">boot/1: loads the node identity key, joins the</text>
<text class="t-desc" x="48" y="628">realm, opens the QUIC pool through the pinned</text>
<text class="t-desc" x="48" y="644">stations, registers chat, serves /health on 8499</text>
<rect class="b-mac" x="512" y="542" width="456" height="120" rx="10"/>
<text class="t-code" x="528" y="570">macula SDK</text>
<text class="t-type" x="528" y="588">[library, ~&gt; 16.0, wire 1.0]</text>
<text class="t-desc" x="528" y="612">QUIC transport, realm member tokens and the</text>
<text class="t-desc" x="528" y="628">D25 grant, RPC dispatch to the provider that</text>
<text class="t-desc" x="528" y="644">answers by name, and the signed DHT records</text>
<rect class="b-ext" x="40" y="728" width="920" height="104" rx="10"/>
<text class="t-code" x="56" y="756">MCL_REALM, MCL_REALM_KEY, MACULA_STATION_SEEDS, MACULA_STATION_NODE_IDS</text>
<text class="t-type" x="56" y="774">[host environment; identity key at /etc/mcl/secrets/identity.key]</text>
<text class="t-desc" x="56" y="798">MCL_HEALTH_PORT 8499 is the /health port. pair_base_url and pair_timeout_ms are app env, defaulting to</text>
<text class="t-desc" x="56" y="814">http://127.0.0.1:11434 and 120000 ms; deploy/docker-compose.yml sets neither.</text>
<path class="edge" d="M512 130H488" marker-end="url(#a)"/>
<text class="t-rel" x="482" y="122" text-anchor="end">starts</text>
<path class="edge" d="M200 190V214" marker-end="url(#a)"/>
<text class="t-rel" x="208" y="206">declares in capabilities/0</text>
<path class="edge" d="M488 284H512" marker-end="url(#a)"/>
<text class="t-rel" x="482" y="276" text-anchor="end">asks allow/1</text>
<path class="edge" d="M260 354V378" marker-end="url(#a)"/>
<text class="t-rel" x="268" y="370">forwards one chat</text>
<path class="edge" d="M488 602H512" marker-end="url(#a)"/>
<text class="t-rel" x="482" y="592" text-anchor="end">uses</text>
<path class="edge" d="M32 130H20V602H32" marker-end="url(#a)"/>
<text class="t-rel" x="26" y="400" text-anchor="middle" transform="rotate(-90 26 400)">boots on</text>
<path class="edge" d="M160 662V728" marker-end="url(#a)"/>
<text class="t-rel" x="168" y="690">reads the identity key</text>
<text class="t-desc" x="40" y="856">config/sys.config.src fixes the org, mcl-nvidia-pair, which names the procedure and the D25 grant, and</text>
<text class="t-desc" x="40" y="874">pins the realm key. No store: this service keeps only the limiter's ETS table,</text>
<text class="t-desc" x="40" y="892">so it mounts one volume, /etc/mcl/secrets, and nothing else.</text>
<rect class="b-sys" x="24" y="930" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="942">In scope</text>
<rect class="b-per" x="110.8" y="930" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="942">Person</text>
<rect class="b-mac" x="184.39999999999998" y="930" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="942">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="930" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="942">External system</text>
<rect class="b-cmp" x="490.0" y="930" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="942">Container or component</text>
</svg>
