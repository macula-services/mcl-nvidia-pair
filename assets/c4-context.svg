@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="560"/>
<rect class="b-per" x="40" y="30" width="270" height="96" rx="10"/>
<circle class="head" cx="66" cy="54" r="9"/>
<text class="t-name" x="84" y="58">Realm member</text>
<text class="t-type" x="84" y="76">[Person]</text>
<text class="t-desc" x="56" y="100">Calls chat from anywhere,</text>
<text class="t-desc" x="56" y="116">with a membership UCAN</text>
<rect class="b-mac" x="690" y="30" width="270" height="110" rx="10"/>
<text class="t-name" x="706" y="58">macula-realm</text>
<text class="t-type" x="706" y="76">[Macula infrastructure]</text>
<text class="t-desc" x="706" y="100">Issues the member UCAN the gate</text>
<text class="t-desc" x="706" y="116">checks offline, and the delegation</text>
<text class="t-desc" x="706" y="132">that authorises this service</text>
<rect class="b-sys" x="365" y="190" width="270" height="130" rx="10"/>
<text class="t-name" x="381" y="218">mcl-nvidia-pair</text>
<text class="t-type" x="381" y="236">[mcl_om mesh service]</text>
<text class="t-desc" x="381" y="260">One procedure: mcl-nvidia-pair/chat,</text>
<text class="t-desc" x="381" y="276">members only. Builds its own request;</text>
<text class="t-desc" x="381" y="292">relays no path and no admin call</text>
<rect class="b-ext" x="40" y="210" width="270" height="96" rx="10"/>
<text class="t-name" x="56" y="238">PAIR Ollama facade</text>
<text class="t-type" x="56" y="256">[External system]</text>
<text class="t-desc" x="56" y="280">Ollama- and OpenAI-compatible</text>
<text class="t-desc" x="56" y="296">HTTP on this host, adopted engines</text>
<rect class="b-ext" x="690" y="200" width="270" height="120" rx="10"/>
<text class="t-name" x="706" y="228">PAIR cluster</text>
<text class="t-type" x="706" y="246">[External system]</text>
<text class="t-desc" x="706" y="270">The household's own machines;</text>
<text class="t-desc" x="706" y="286">PAIR routes, schedules and fails</text>
<text class="t-desc" x="706" y="302">over inside it, unchanged</text>
<rect class="b-mac" x="365" y="400" width="270" height="110" rx="10"/>
<text class="t-name" x="381" y="428">Macula mesh</text>
<text class="t-type" x="381" y="446">[Macula infrastructure]</text>
<text class="t-desc" x="381" y="470">Stations carry the call; the DHT</text>
<text class="t-desc" x="381" y="486">carries the advertisement members</text>
<text class="t-desc" x="381" y="502">resolve</text>
<path class="edge" d="M175 126V160H420V190" marker-end="url(#a)"/>
<text class="t-rel" x="300" y="152" text-anchor="middle">chat, member UCAN</text>
<path class="edge" d="M825 140V160H580V190" marker-end="url(#a)"/>
<text class="t-rel" x="720" y="152" text-anchor="middle">admission, UCAN</text>
<path class="edge" d="M365 255H310" marker-end="url(#a)"/>
<text class="t-rel" x="337" y="246" text-anchor="middle">loopback</text>
<text class="t-rel" x="337" y="272" text-anchor="middle">HTTP</text>
<path class="edge" d="M175 306V365H880V320" marker-end="url(#a)"/>
<text class="t-rel" x="528" y="356">engines, on the household's machines</text>
<path class="edge" d="M500 320V400" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="366">advertises, answers</text>
<rect class="b-sys" x="24" y="530" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="542">In scope</text>
<rect class="b-per" x="110.8" y="530" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="542">Person</text>
<rect class="b-mac" x="184.39999999999998" y="530" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="542">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="530" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="542">External system</text>
<rect class="b-cmp" x="490.0" y="530" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="542">Container or component</text>
<rect class="b-later" x="669.2" y="530" width="22" height="14" rx="3"/>
<text class="t-leg" x="699.2" y="542">Planned, not built</text>
